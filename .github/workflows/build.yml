name: Build and Release

# 触发条件修改：
# 只有当你推送以 'v' 开头的标签（如 v1.0, v2.0）时，才会运行
on:
  push:
    tags:
      - "v*"

# 权限设置：允许这个脚本创建 Release
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # --- Windows 打包 ---
      - name: Build with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          # 生成 exe
          pyinstaller --noconsole --onefile --name="MettlerHelper_Win" gui.py

      # --- macOS 打包 ---
      - name: Build with PyInstaller (macOS)
        if: runner.os == 'macOS'
        run: |
          # 生成 Unix 可执行文件
          pyinstaller --onefile --name="MettlerHelper_Mac" gui.py

          # 【重要】把 Mac 程序压缩成 zip
          # 否则直接下载二进制文件，Mac 系统可能会因为权限问题不让运行
          cd dist
          zip -r MettlerHelper_Mac.zip MettlerHelper_Mac

      # --- 发布到 Releases 页面 (核心步骤) ---
      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/MettlerHelper_Win.exe
            dist/MettlerHelper_Mac.zip
